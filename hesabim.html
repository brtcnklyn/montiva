<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hesabım — NOVORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=7">
</head>
<body>

<main>
  <div class="page-hero">
    <div class="container">
      <h1 id="hello">Hesabım</h1>
      <p id="hello-sub">Siparişlerinizi takip edin, bilgilerinizi güncelleyin.</p>
    </div>
  </div>

  <div class="container acct-layout">
    <aside class="acct-nav" id="acct-nav"></aside>
    <div id="acct-view"></div>
  </div>
</main>

<script src="assets/js/icons.js?v=7"></script>
<script src="assets/js/seed.js?v=7"></script>
<script src="assets/js/db.js?v=7"></script>
<script src="assets/js/auth.js?v=7"></script>
<script src="assets/js/store.js?v=7"></script>
<script src="assets/js/chat.js?v=7"></script>
<script>
  renderChrome();
  if (!requireLogin("hesabim.html")) throw new Error("yönlendiriliyor");
  let me = AUTH.current();
  document.getElementById("hello").textContent = `Merhaba, ${me.name.split(" ")[0]}`;
  document.getElementById("hello-sub").textContent = me.email;

  const TABS = [
    { id: "orders",  i: "package",  t: "Siparişlerim" },
    { id: "returns", i: "return",   t: "İade Takibi" },
    { id: "profile", i: "user",     t: "Profil Bilgilerim" },
    { id: "security",i: "lock",     t: "Şifre Değiştir" }
  ];
  let tab = new URLSearchParams(location.search).get("t") || "orders";

  function drawNav() {
    document.getElementById("acct-nav").innerHTML =
      TABS.map(x => `<a class="${x.id === tab ? "active" : ""}" onclick="go('${x.id}')">${icon(x.i,17)} ${x.t}</a>`).join("") +
      `<a class="sep-top danger" onclick="cikis()">${icon("logout",17)} Çıkış Yap</a>`;
  }
  function go(t) { tab = t; history.replaceState(null,"", "hesabim.html?t=" + t); drawNav(); draw(); }
  function cikis() { AUTH.logout(); location.href = "index.html"; }

  const ORDER_STEPS = ["Yeni","Hazırlanıyor","Kargoda","Teslim Edildi"];
  function statusPill(s) {
    const map = { "Yeni":"blue","Hazırlanıyor":"amber","Kargoda":"blue","Teslim Edildi":"green","İptal":"red",
                  "Talep Alındı":"blue","İnceleniyor":"amber","Onaylandı":"green","Kargo Bekleniyor":"amber","Tamamlandı":"green","Reddedildi":"red" };
    return `<span class="pill ${map[s]||"grey"}">${s}</span>`;
  }

  function draw() {
    const box = document.getElementById("acct-view");

    if (tab === "orders") {
      const list = AUTH.myOrders();
      box.innerHTML = `<div class="form-card"><h3>${icon("package",18)} Siparişlerim</h3>
        ${list.length ? list.map(o => `
          <div class="acct-order">
            <div class="ao-head">
              <div><span class="muted">Sipariş No</span><b>${o.no}</b></div>
              <div><span class="muted">Tarih</span><b>${new Date(o.date).toLocaleDateString("tr-TR")}</b></div>
              <div><span class="muted">Tutar</span><b>${o.total}</b></div>
              <div>${statusPill(o.status||"Yeni")}</div>
            </div>
            <div class="ao-items">${(o.items||[]).map(i => `<span>${i.name} ${i.color?"· "+i.color:""} × ${i.qty}</span>`).join("")}</div>
            <div class="ao-actions">
              <a class="btn-sm btn-save" href="siparis-takip.html?no=${encodeURIComponent(o.no)}&mail=${encodeURIComponent(o.email)}">Detay & Takip</a>
              <a class="btn-sm btn-ghost-sm" href="iade.html?no=${encodeURIComponent(o.no)}&mail=${encodeURIComponent(o.email)}">İade Talebi</a>
            </div>
          </div>`).join("")
        : `<div class="acct-empty">${icon("package",40)}<p>Henüz siparişiniz yok.</p><a href="urunler.html" class="btn btn-primary">Alışverişe Başla</a></div>`}
      </div>`;
    }

    if (tab === "returns") {
      const list = AUTH.myReturns();
      box.innerHTML = `<div class="form-card"><h3>${icon("return",18)} İade Takibi</h3>
        ${list.length ? list.map(r => `
          <div class="acct-order">
            <div class="ao-head">
              <div><span class="muted">İade No</span><b>${r.no}</b></div>
              <div><span class="muted">Sipariş</span><b>${r.orderNo}</b></div>
              <div><span class="muted">Tarih</span><b>${new Date(r.date).toLocaleDateString("tr-TR")}</b></div>
              <div>${statusPill(r.status)}</div>
            </div>
            <div class="ao-items"><span>Sebep: ${r.reason}</span></div>
          </div>`).join("")
        : `<div class="acct-empty">${icon("return",40)}<p>İade talebiniz bulunmuyor.</p><a href="iade.html" class="btn btn-ghost">İade Talebi Oluştur</a></div>`}
      </div>`;
    }

    if (tab === "profile") {
      box.innerHTML = `<div class="form-card"><h3>${icon("user",18)} Profil Bilgilerim</h3>
        <div class="frow">
          <div class="field"><label>Ad Soyad</label><input id="p-name" value="${me.name||""}"></div>
          <div class="field"><label>E-posta <span class="opt">(değiştirilemez)</span></label><input value="${me.email}" disabled></div>
        </div>
        <div class="frow">
          <div class="field"><label>Telefon</label><input id="p-tel" value="${me.phone||""}" placeholder="05xx xxx xx xx"></div>
          <div class="field"><label>İl</label><input id="p-city" value="${me.city||""}"></div>
        </div>
        <div class="frow">
          <div class="field"><label>İlçe</label><input id="p-dist" value="${me.district||""}"></div>
          <div class="field"><label>Üyelik Tarihi</label><input value="${new Date(me.created).toLocaleDateString("tr-TR")}" disabled></div>
        </div>
        <div class="field"><label>Adres</label><textarea id="p-addr" rows="3">${me.address||""}</textarea></div>
        <label class="check-line"><input type="checkbox" id="p-camp" ${me.campaigns?"checked":""}> <span>Kampanya ve yeni ürün duyurularını e-posta ile almak istiyorum.</span></label>
        <div class="lookup-msg" id="p-msg"></div>
        <button class="btn btn-primary" style="width:100%" onclick="kaydet()">Bilgilerimi Kaydet</button>
        <p class="muted" style="font-size:.82rem;margin-top:12px">Bu bilgiler sipariş sırasında otomatik doldurulur.</p>
      </div>`;
    }

    if (tab === "security") {
      box.innerHTML = `<div class="form-card"><h3>${icon("lock",18)} Şifre Değiştir</h3>
        <div class="field"><label>Mevcut Şifre</label><input id="s-old" type="password" autocomplete="current-password"></div>
        <div class="field"><label>Yeni Şifre <span class="opt">(en az 6 karakter)</span></label><input id="s-new" type="password" autocomplete="new-password"></div>
        <div class="field"><label>Yeni Şifre (tekrar)</label><input id="s-new2" type="password" autocomplete="new-password"></div>
        <div class="lookup-msg" id="s-msg"></div>
        <button class="btn btn-primary" style="width:100%" onclick="sifreDegistir()">Şifremi Güncelle</button>
      </div>`;
    }
  }

  const say = (id, cls, txt) => {
    const el = document.getElementById(id);
    el.className = "lookup-msg " + cls;
    el.innerHTML = (cls === "err" ? icon("alert",15) : icon("check",15)) + " " + txt;
  };

  function kaydet() {
    try {
      me = AUTH.updateProfile({
        name: document.getElementById("p-name").value,
        phone: document.getElementById("p-tel").value,
        city: document.getElementById("p-city").value,
        district: document.getElementById("p-dist").value,
        address: document.getElementById("p-addr").value,
        campaigns: document.getElementById("p-camp").checked
      });
      say("p-msg","ok","Bilgileriniz kaydedildi.");
      document.getElementById("hello").textContent = `Merhaba, ${me.name.split(" ")[0]}`;
      renderProfileMenu();
    } catch (e) { say("p-msg","err",e.message); }
  }

  async function sifreDegistir() {
    const a = document.getElementById("s-old").value, b = document.getElementById("s-new").value, c = document.getElementById("s-new2").value;
    if (b !== c) return say("s-msg","err","Yeni şifreler eşleşmiyor.");
    try { await AUTH.changePassword(a, b); say("s-msg","ok","Şifreniz güncellendi.");
      ["s-old","s-new","s-new2"].forEach(i => document.getElementById(i).value = "");
    } catch (e) { say("s-msg","err",e.message); }
  }

  drawNav(); draw();
</script>
</body>
</html>
