<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İletişim — NOVORA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body>

<main>
  <div class="page-hero">
    <div class="container">
      <h1 data-content="contact.title"></h1>
      <p data-content="contact.sub"></p>
    </div>
  </div>

  <section class="block">
    <div class="container" style="display:grid;grid-template-columns:1fr 1.4fr;gap:32px;align-items:start" id="contact-grid">
      <div>
        <div class="feature" style="margin-bottom:14px"><div class="ic"><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 8V4H8"/><rect width="16" height="12" x="4" y="8" rx="2"/><path d="M2 14h2"/><path d="M20 14h2"/><path d="M15 13v2"/><path d="M9 13v2"/></svg></div><div><b>AI Canlı Destek</b><span>7/24 anında yanıt — sağ alttaki balona tıklayın.</span></div></div>
        <div class="feature" style="margin-bottom:14px"><div class="ic"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.99 5.73a2 2 0 0 1-2.01 0L2 7"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg></div><div><b>E-posta</b><span>destek@novora.com.tr<br>48 saat içinde yanıt</span></div></div>
        <div class="feature" style="margin-bottom:14px"><div class="ic"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.83 16.57a1 1 0 0 0 1.21-.3l.36-.47A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.47.35a1 1 0 0 0-.29 1.24 14 14 0 0 0 6.39 6.38"/></svg></div><div><b>Telefon</b><span>0850 000 00 00<br>Hafta içi 09:00 – 18:00</span></div></div>
        <div class="feature"><div class="ic"><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg></div><div><b>Atölye</b><span>Üretim ve sevkiyat merkezimiz<br>(adres eklenecek)</span></div></div>
      </div>
      <div class="form-card" style="margin-bottom:0">
        <h3><span class="n">✉</span> Bize Yazın</h3>
        <form id="contactForm" novalidate>
          <div class="frow">
            <div class="field"><label>Adınız *</label><input id="cf-name" required></div>
            <div class="field"><label>E-posta *</label><input id="cf-email" type="email" required></div>
          </div>
          <div class="field"><label>Konu</label>
            <select id="cf-subject">
              <option>Genel soru</option>
              <option>Sipariş / kargo durumu</option>
              <option>Montaj desteği</option>
              <option>İade / değişim</option>
              <option>Eksik / hasarlı parça</option>
              <option>Özel üretim talebi</option>
            </select>
          </div>
          <div class="field"><label>Mesajınız *</label><textarea id="cf-msg" rows="5" required></textarea></div>
          <button type="submit" class="btn btn-primary" style="width:100%">Gönder →</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/icons.js?v=5"></script>
<script src="assets/js/seed.js?v=5"></script>
<script src="assets/js/db.js?v=5"></script>
<script src="assets/js/auth.js?v=5"></script>
<script src="assets/js/store.js?v=5"></script>
<script src="assets/js/chat.js?v=5"></script>
<script>
  renderChrome("contact");
  if (matchMedia("(max-width:960px)").matches) document.getElementById("contact-grid").style.gridTemplateColumns = "1fr";
  document.getElementById("contactForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const ids = ["cf-name", "cf-email", "cf-msg"];
    let ok = true;
    ids.forEach(id => {
      const el = document.getElementById(id);
      const bad = !el.value.trim() || (id === "cf-email" && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(el.value));
      el.classList.toggle("err", bad);
      if (bad) ok = false;
    });
    if (!ok) { toast(icon("alert",15) + " Lütfen zorunlu alanları doldurun"); return; }
    DB.addMessage({ name: cf_name.value, email: cf_email.value, subject: cf_subject.value, msg: cf_msg.value, date: new Date().toISOString() });
    this.reset();
    toast(icon("check",15) + " Mesajınız alındı! En kısa sürede dönüş yapacağız.");
  });
</script>
</body>
</html>
