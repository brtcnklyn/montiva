<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sepetim — MONTIVA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <div class="page-hero">
    <div class="container"><h1>Sepetim</h1><p>Ürünlerini kontrol et, ödemeye geç.</p></div>
  </div>
  <div class="container" id="cart-root"></div>
</main>

<script src="assets/js/icons.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/db.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/chat.js"></script>
<script>
  renderChrome();
  function renderCart() {
    const cart = getCart();
    const root = document.getElementById("cart-root");
    if (!cart.length) {
      root.innerHTML = `
        <div class="empty-state">
          <div class="big"><svg class="ic-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div>
          <h2>Sepetiniz boş</h2>
          <p>Kahve köşenizi kurmaya başlamak için ürünlerimize göz atın.</p>
          <a href="urunler.html" class="btn btn-primary">Ürünleri Keşfet →</a>
        </div>`;
      return;
    }
    const total = cartTotal();
    root.innerHTML = `
      <div class="cart-layout">
        <div class="cart-items">
          ${cart.map(r => {
            const p = getProduct(r.id);
            return `
            <div class="cart-item">
              <a href="urun.html?id=${p.id}"><img src="${p.images[0]}" alt="${p.name}"></a>
              <div class="t">
                <b><a href="urun.html?id=${p.id}">${p.name}</a></b>
                <span>${p.color} • ${fmtPrice(p.price)} / adet</span>
                <div class="qty" style="margin-top:10px;display:inline-flex">
                  <button onclick="setQty('${p.id}', ${r.qty - 1}); renderCart()">−</button>
                  <input value="${r.qty}" readonly>
                  <button onclick="setQty('${p.id}', ${r.qty + 1}); renderCart()">+</button>
                </div>
              </div>
              <div class="right">
                <span class="line-price">${fmtPrice(p.price * r.qty)}</span>
                <button class="remove-btn" onclick="removeFromCart('${p.id}'); renderCart()">Kaldır ✕</button>
              </div>
            </div>`;
          }).join("")}
        </div>
        <div class="summary">
          <h3>Sipariş Özeti</h3>
          <div class="row"><span>Ara Toplam</span><span>${fmtPrice(total)}</span></div>
          <div class="row"><span>Kargo</span><span style="color:var(--green);font-weight:700">Ücretsiz</span></div>
          <div class="row total"><span>Toplam</span><span>${fmtPrice(total)}</span></div>
          <a href="odeme.html"><button class="btn btn-primary">Ödemeye Geç →</button></a>
          <div class="free-ship-note"><svg class="ic-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.94 15.5A2 2 0 0 0 8.5 14.06l-6.14-1.58a.5.5 0 0 1 0-.96L8.5 9.94A2 2 0 0 0 9.94 8.5l1.58-6.14a.5.5 0 0 1 .96 0L14.06 8.5A2 2 0 0 0 15.5 9.94l6.14 1.58a.5.5 0 0 1 0 .96L15.5 14.06a2 2 0 0 0-1.44 1.44l-1.58 6.14a.5.5 0 0 1-.96 0z"/></svg> Ücretsiz kargo kazandınız!</div>
        </div>
      </div>`;
  }
  renderCart();
</script>
</body>
</html>
