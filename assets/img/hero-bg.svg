<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A2647"/>
      <stop offset="0.55" stop-color="#0E3E6E"/>
      <stop offset="1" stop-color="#14508C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.32" r="0.55">
      <stop offset="0" stop-color="#2E82FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2E82FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="760" fill="url(#bg)"/>
  <rect width="1600" height="760" fill="url(#glow)"/>
  <rect width="1600" height="760" fill="url(#dots)"/>

  <!-- yumuşak geometrik daireler -->
  <circle cx="1330" cy="90" r="360" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="1330" cy="90" r="250" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="2"/>
  <circle cx="150" cy="720" r="320" fill="#ffffff" opacity="0.03"/>
  <path d="M1120 760 a 340 340 0 0 1 340 -340" fill="none" stroke="#C0824B" stroke-opacity="0.55" stroke-width="6"/>

  <!-- imza kahve köşesi rafı (çizgisel) -->
  <g stroke="#ffffff" stroke-opacity="0.30" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- kemer -->
    <path d="M1085 300 A 115 115 0 0 1 1315 300"/>
    <!-- dikey profiller -->
    <path d="M1085 300 V 640"/>
    <path d="M1315 300 V 640"/>
    <!-- raflar -->
    <path d="M1085 300 H 1315"/>
    <path d="M1085 410 H 1315"/>
    <path d="M1085 520 H 1315"/>
    <path d="M1075 640 H 1325"/>
    <!-- ayaklar -->
    <path d="M1085 640 l -14 26"/>
    <path d="M1315 640 l 14 26"/>

    <!-- kahve fincanı (2. raf) -->
    <path d="M1130 372 h46 v20 a23 23 0 0 1 -46 0 z"/>
    <path d="M1176 377 a13 13 0 0 1 0 22"/>
    <path d="M1141 362 q7 -12 0 -22"/>
    <path d="M1157 362 q7 -12 0 -22"/>

    <!-- kavanoz + kitaplar (3. raf) -->
    <rect x="1130" y="470" width="34" height="42" rx="6"/>
    <path d="M1185 512 v-34 h10 v34"/>
    <path d="M1200 512 v-30 h9 v30"/>

    <!-- üst rafta bitki -->
    <path d="M1200 300 v-26"/>
    <path d="M1200 282 q-16 -6 -22 -22 q18 0 22 16 q4 -16 22 -16 q-6 16 -22 22"/>
  </g>

  <!-- ince aksan çizgiler (sol alt) -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <path d="M-40 560 L 320 200"/>
    <path d="M-40 640 L 400 200"/>
  </g>
</svg>
